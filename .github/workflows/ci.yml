name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    strategy:
      fail-fast: false
      matrix:
        lua:
          - name: LuaJIT
            pkg: luajit
            dev_package: libluajit-5.1-dev
            interpreter: luajit
          - name: Lua 5.2
            pkg: lua5.2
            dev_package: liblua5.2-dev
            interpreter: lua5.2
          - name: Lua 5.3
            pkg: lua5.3
            dev_package: liblua5.3-dev
            interpreter: lua5.3

    name: Build & Test (${{ matrix.lua.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          sudo sh -c 'echo Etc/UTC > /etc/timezone'
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y --no-install-recommends \
            build-essential \
            fonts-noto-cjk \
            wlr-randr \
            grim \
            dpkg-dev \
            ninja-build \
            python3-pip \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libdbus-1-dev \
            dbus \
            libglib2.0-bin \
            bc \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-errors-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            ${{ matrix.lua.interpreter }} \
            ${{ matrix.lua.dev_package }} \
            lua-busted \
            lua-lgi \
            luarocks \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gir1.2-pango-1.0 \
            gir1.2-gdk-3.0 \
            gir1.2-rsvg-2.0 \
            libxml2-dev \
            bison \
            foot \
            xterm \
            xwayland \
            zsh

      - name: Show test font resolution
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fonts.conf
        run: |
          fc-match -v sans | grep -E 'family|fontversion'
          fc-match -v monospace | grep -E 'family|fontversion'

      - name: Upgrade meson
        run: python3 -m pip install --upgrade --break-system-packages meson

      - name: Cache Lua 5.2 CI deps
        if: matrix.lua.pkg == 'lua5.2'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/lua-5.2-ci
          key: deps-lua5.2-ci-lgi-0.9.2-busted-2.3.0-${{ runner.os }}}-v2

      - name: Prepare Lua 5.2 CI deps
        if: matrix.lua.pkg == 'lua5.2'
        run: |
          set -eu
          mkdir -p "$HOME/lua-5.2-ci"

          # Ubuntu no longer ships these modules for Lua 5.2 (just 5.1 and 5.3), so build them from source.
          if [ ! -f "$HOME/lua-5.2-ci/share/lua/5.2/lgi/init.lua" ]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update
            cd /tmp
            apt-get source lua-lgi
            cd lua-lgi-*/
            make -C lgi LUA_VERSION=5.2 PREFIX="$HOME/lua-5.2-ci" LUA_CFLAGS="$(pkg-config --cflags lua5.2)" VERSION=0.9.2
            make -C lgi install LUA_VERSION=5.2 PREFIX="$HOME/lua-5.2-ci" LUA_CFLAGS="$(pkg-config --cflags lua5.2)" VERSION=0.9.2
          fi

          if [ ! -x "$HOME/lua-5.2-ci/bin/busted" ]; then
            luarocks --lua-version=5.2 --tree="$HOME/lua-5.2-ci" install busted 2.3.0-1
          fi

          sudo mkdir -p /usr/local/share/lua/5.2 /usr/local/lib/lua/5.2
          sudo cp -a "$HOME/lua-5.2-ci/share/lua/5.2/." /usr/local/share/lua/5.2/
          sudo cp -a "$HOME/lua-5.2-ci/lib/lua/5.2/." /usr/local/lib/lua/5.2/
          sudo install -Dm755 "$HOME/lua-5.2-ci/bin/busted" /usr/local/bin/busted

      - name: Build somewm
        run: |
          make build-test LUA_PKG=${{ matrix.lua.pkg }}

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests (non-spawning only)
        run: |
          # Exclude tests that need external apps or client spawning
          spawning=$(grep -rl 'require.*_client' tests/test-*.lua | xargs -I{} basename {})
          tests=$(find tests -name 'test-*.lua' -type f \
            ! -name 'test-xwayland-*' \
            ! -name 'test-layer-shell-*' \
            ! -name 'test-dbus-error.lua' \
            ! -name 'test-transient-stacking.lua' \
            ! -name 'test-output-fake-screen.lua' \
            $(printf '! -name %s ' $spawning) \
            | sort)
          timeout 1500 bash tests/run-integration.sh $tests
        timeout-minutes: 30
        env:
          SOMEWM: ./build-test/somewm
          SOMEWM_CLIENT: ./build-test/somewm-client
          HEADLESS: 1
          LIBSEAT_BACKEND: noop
          TEST_TIMEOUT: 45

      - name: Run restart / hot-reload tests
        # No X client can connect on the runners, so the X11 restart test is
        # left out the way the integration step leaves out test-xwayland-*.
        run: |
          tests=$(find tests/restart -maxdepth 1 -name '*.sh' -type f ! -name 'lib.sh' ! -name 'x11-*' | sort)
          SOMEWM=./build-test/somewm SOMEWM_CLIENT=./build-test/somewm-client timeout 900 ./tests/run-restart.sh $tests
        timeout-minutes: 16
        env:
          LIBSEAT_BACKEND: noop
          REQUIRE_ALL: 1
          # The suite runs in ~150s and its slowest test takes ~13s, so 60s per
          # test is generous. The default 180 is not: a handful of hung tests
          # would spend the 900s budget above, and an outer kill reports no
          # verdict at all, where a per-test timeout names the test that hung.
          RESTART_TEST_TIMEOUT: 60

      - name: Upload restart test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restart-logs-${{ matrix.lua.name }}
          path: build-test/restart-artifacts/
          if-no-files-found: ignore

  lua-compat:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua interpreters
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            librsvg2-dev \
            luajit lua5.1 lua5.2 lua5.3 lua5.4

      - name: Parse lua/ with every interpreter
        run: ./tests/check-lua-compat.sh
        env:
          LUA_COMPAT_REQUIRED: luajit lua5.1 lua5.2 lua5.3 lua5.4

  build-debian-stable:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    name: Build (Debian stable, vendored floors)

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libinput-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-errors-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            libpam0g-dev \
            xwayland \
            lua5.3 \
            liblua5.3-dev \
            lua-lgi \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libffi-dev \
            libexpat1-dev \
            libxml2-dev \
            bison

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # wayland, libdrm, xkbcommon, pixman and wayland-protocols are all older here than
      # wlroots 0.20.2 needs, so each must be built from its wrap, and wlroots once.
      # Build-only: busted is not packaged here, so unit tests run on the matrix legs.
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup build -Dlua_pkg=lua5.3 | tee setup.log
          for p in wayland libdrm libxkbcommon pixman wayland-protocols wlroots; do
            test "$(grep -c "^Executing subproject $p " setup.log)" = 1
          done

      - name: Build
        run: ninja -C build

  build-ubuntu-lts:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    name: Build (Ubuntu 24.04, vendored floors)

    steps:
      - name: Install dependencies
        # libxcb-errors is not packaged on 24.04; wlroots builds without it.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libinput-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            libpam0g-dev \
            xwayland \
            lua5.3 \
            liblua5.3-dev \
            lua-lgi \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libffi-dev \
            libexpat1-dev \
            libxml2-dev \
            bison

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # wayland, libdrm, xkbcommon, pixman and wayland-protocols are all older here than
      # wlroots 0.20.2 needs, so each must be built from its wrap, and wlroots once.
      # Build-only: busted is not packaged here, so unit tests run on the matrix legs.
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup build -Dlua_pkg=lua5.3 | tee setup.log
          for p in wayland libdrm libxkbcommon pixman wayland-protocols wlroots; do
            test "$(grep -c "^Executing subproject $p " setup.log)" = 1
          done
          test "$(grep -c '^Executing subproject wlroots:libdisplay-info' setup.log)" = 1

      - name: Build
        run: ninja -C build
