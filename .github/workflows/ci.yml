name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # One image per Lua variant, from .github/ci.Dockerfile, tagged by that
  # file's hash. The build runs only when the tag is missing from GHCR, so a
  # normal run spends about 20s here and the matrix skips apt entirely.
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      prefix: ${{ steps.tag.outputs.prefix }}
      compat: ${{ steps.tag.outputs.compat }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Tag
        id: tag
        run: |
          echo "prefix=ghcr.io/${{ github.repository }}-ci:${{ hashFiles('.github/ci.Dockerfile') }}" >> "$GITHUB_OUTPUT"
          echo "compat=ghcr.io/${{ github.repository }}-ci:${{ hashFiles('.github/lua-compat.Dockerfile') }}-compat" >> "$GITHUB_OUTPUT"

      - name: Build and push missing images
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for v in "luajit libluajit-5.1-dev" "lua5.2 liblua5.2-dev" "lua5.3 liblua5.3-dev"; do
            set -- $v
            ref="${{ steps.tag.outputs.prefix }}-$1"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "$ref exists"
              continue
            fi
            docker build -f .github/ci.Dockerfile \
              --build-arg LUA_INTERPRETER="$1" --build-arg LUA_DEV_PACKAGE="$2" \
              -t "$ref" .github
            docker push "$ref"
          done
          ref="${{ steps.tag.outputs.compat }}"
          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            docker build -f .github/lua-compat.Dockerfile -t "$ref" .github
            docker push "$ref"
          fi

  build-and-test:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The package is private, so the pull needs the token.
    container:
      image: ${{ needs.image.outputs.prefix }}-${{ matrix.lua.interpreter }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        lua:
          - name: LuaJIT
            pkg: luajit
            interpreter: luajit
          - name: Lua 5.2
            pkg: lua5.2
            interpreter: lua5.2
          - name: Lua 5.3
            pkg: lua5.3
            interpreter: lua5.3

    name: Build & Test (${{ matrix.lua.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show test font resolution
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fonts.conf
        run: |
          fc-match -v sans | grep -E 'family|fontversion'
          fc-match -v monospace | grep -E 'family|fontversion'

      - name: Build somewm
        run: |
          make build-test LUA_PKG=${{ matrix.lua.pkg }}

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests (non-spawning only)
        run: timeout 1500 make test-ci
        timeout-minutes: 30

  # The restart suite is 38 serial compositor starts, about 250s. Its own job
  # runs it beside the integration step instead of after it.
  restart-tests:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.prefix }}-${{ matrix.lua.interpreter }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        lua:
          - name: LuaJIT
            pkg: luajit
            interpreter: luajit
          - name: Lua 5.2
            pkg: lua5.2
            interpreter: lua5.2
          - name: Lua 5.3
            pkg: lua5.3
            interpreter: lua5.3

    name: Restart (${{ matrix.lua.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build somewm
        run: make build-test LUA_PKG=${{ matrix.lua.pkg }}

      - name: Run restart / hot-reload tests
        # No X client can connect on the runners, so the X11 restart test is
        # left out the way the integration step leaves out test-xwayland-*.
        run: |
          tests=$(find tests/restart -maxdepth 1 -name '*.sh' -type f ! -name 'lib.sh' ! -name 'x11-*' | sort)
          SOMEWM=./build-test/somewm SOMEWM_CLIENT=./build-test/somewm-client timeout 900 ./tests/run-restart.sh $tests
        timeout-minutes: 16
        env:
          LIBSEAT_BACKEND: noop
          REQUIRE_ALL: 1
          # The slowest test takes ~15s, so 60s per test is generous. The
          # default 180 is not: a handful of hung tests would spend the 900s
          # budget above, and an outer kill reports no verdict at all, where a
          # per-test timeout names the test that hung.
          RESTART_TEST_TIMEOUT: 60

      - name: Upload restart test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restart-logs-${{ matrix.lua.name }}
          path: build-test/restart-artifacts/
          if-no-files-found: ignore

  lua-compat:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.compat }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse lua/ with every interpreter
        run: ./tests/check-lua-compat.sh
        env:
          LUA_COMPAT_REQUIRED: luajit lua5.1 lua5.2 lua5.3 lua5.4

  build-debian-stable:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    name: Build (Debian stable, vendored floors)

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libinput-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-errors-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            libpam0g-dev \
            xwayland \
            lua5.3 \
            liblua5.3-dev \
            lua-lgi \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libffi-dev \
            libexpat1-dev \
            libxml2-dev \
            bison

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # wayland, libdrm, xkbcommon, pixman and wayland-protocols are all older here than
      # wlroots 0.20.2 needs, so each must be built from its wrap, and wlroots once.
      # Build-only: busted is not packaged here, so unit tests run on the matrix legs.
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup build -Dlua_pkg=lua5.3 | tee setup.log
          for p in wayland libdrm libxkbcommon pixman wayland-protocols wlroots; do
            test "$(grep -c "^Executing subproject $p " setup.log)" = 1
          done

      - name: Build
        run: ninja -C build

  build-ubuntu-lts:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    name: Build (Ubuntu 24.04, vendored floors)

    steps:
      - name: Install dependencies
        # libxcb-errors is not packaged on 24.04; wlroots builds without it.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libxkbcommon-dev \
            libinput-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-xfixes0-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-shm0-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            libpam0g-dev \
            xwayland \
            lua5.3 \
            liblua5.3-dev \
            lua-lgi \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libffi-dev \
            libexpat1-dev \
            libxml2-dev \
            bison

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # wayland, libdrm, xkbcommon, pixman and wayland-protocols are all older here than
      # wlroots 0.20.2 needs, so each must be built from its wrap, and wlroots once.
      # Build-only: busted is not packaged here, so unit tests run on the matrix legs.
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup build -Dlua_pkg=lua5.3 | tee setup.log
          for p in wayland libdrm libxkbcommon pixman wayland-protocols wlroots; do
            test "$(grep -c "^Executing subproject $p " setup.log)" = 1
          done
          test "$(grep -c '^Executing subproject wlroots:libdisplay-info' setup.log)" = 1

      - name: Build
        run: ninja -C build
