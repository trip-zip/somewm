name: Bug report
description: Report a bug or unexpected behavior in somewm
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Which branch is this bug on?

        somewm has two release lines:

        - **1.4** (`release/1.4`, AUR `somewm`) is the AwesomeWM-compatible line. Bugs here are regressions against AwesomeWM.
        - **2.x** (`main`, AUR `somewm-git`, any 2.x release) is the current line. Only the newest 2.x release gets fixes.

        `somewm --version` tells you which: v1.4.x is 1.4, anything from v2.0 on is 2.x.

        If the log says a widget "draws itself ... and is left out of the tree", that is a 2.1 removal, not a bug. See [Choosing a version](https://github.com/trip-zip/somewm#choosing-a-version).

  - type: dropdown
    id: branch
    attributes:
      label: Version
      description: Which release line is this bug on?
      options:
        - 1.4 (release/1.4)
        - 2.x (main or a 2.x release)
        - Not sure, need help figuring it out
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: somewm --version output
      description: Paste the full output of `somewm --version`. This tells us your exact build, wlroots version, distro, GPU, and session type.
      render: shell
      placeholder: |
        ## somewm version info

        **somewm:** ...
        **wlroots:** ...
        ...
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: How did you install somewm?
      options:
        - Distro package (AUR, nixpkgs, etc.)
        - Built from a tagged release
        - Built from release/1.4
        - Built from main
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps that trigger the bug. Minimal repros get fixed first.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: false

  - type: textarea
    id: rc_lua
    attributes:
      label: Relevant rc.lua
      description: The parts of your rc.lua that trigger the bug. Leave blank if the bug reproduces with the fallback config.
      render: lua
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, crash output, or backtrace
      description: |
        Anything from stderr, journal, or `coredumpctl info somewm`. For crashes, a full backtrace is hugely helpful.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have tested with a minimal `rc.lua` (or `rc_fallback.lua`) to confirm this is not a bug in my own config.
          required: true
        - label: I have checked `somewm --version` and selected the matching version above.
          required: true
